name: snip-api

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/snip-api.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/snip-api.yml"]
  workflow_dispatch: # handmatig starten vanuit het Actions-tabblad

permissions:
  contents: read
  packages: write # nodig om naar GHCR te pushen

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.versie.outputs.version }} # doorgeven aan de deploy-job
    steps:
      # Alle actions zijn vastgepind op een commit-SHA, niet op een tag. Tags kunnen worden
      # verplaatst (zie het Trivy-incident van maart 2026), een SHA niet.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Naam en versie bepalen
        id: versie
        run: |
          # GHCR accepteert alleen kleine letters in image-namen.
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/snip-api" >> "$GITHUB_ENV"
          echo "VERSION=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Tags en labels bepalen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Bouwen om te scannen (alleen amd64, blijft op de runner)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/api
          load: true
          tags: snip-api:scan
          build-args: APP_VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scannen op kwetsbaarheden
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: snip-api:scan
          version: v0.76.0
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1" # pipeline faalt bij een oplosbare HIGH of CRITICAL

      - name: Inloggen bij GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bouwen en pushen (amd64 + arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/api
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

test-bijwerken:
    needs: build # pas na een geslaagde build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # mag commits naar de repo pushen
    concurrency: test-bijwerken # nooit twee tegelijk, anders botsen de commits
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # de nieuwste main, niet de commit waarmee deze run begon

      - name: Nieuwe tag in de test-overlay
        run: |
          yq -i '(.images[] | select(.name == "ghcr.io/bernardus/snip-api")).newTag = strenv(VERSION)' \
            k8s/overlays/test/kustomization.yaml
          git diff

      - name: Committen en pushen
        run: |
          if git diff --quiet; then
            echo "test staat al op $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "test: snip-api $VERSION"
          for _ in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main # iemand pushte net iets; zet onze commit erbovenop
          done
          exit 1