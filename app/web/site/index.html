<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>snip</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    main { max-width: 40rem; margin: 0 auto; padding: 3rem 1rem; }
    h1 { font-size: 2.5rem; margin: 0 0 .25rem; } h1 span { color: #38bdf8; }
    .sub { color: #94a3b8; margin: 0 0 2rem; }
    form { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .5rem; }
    input { flex: 1 1 12rem; padding: .6rem .8rem; border-radius: .4rem; border: 1px solid #334155; background: #1e293b; color: inherit; font: inherit; }
    input.code { flex: 0 1 8rem; }
    button { padding: .6rem 1rem; border: 0; border-radius: .4rem; background: #38bdf8; color: #0f172a; font: inherit; font-weight: 600; cursor: pointer; }
    #melding { min-height: 1.5rem; color: #fca5a5; }
    ul { list-style: none; padding: 0; } li { display: flex; gap: 1rem; padding: .6rem 0; border-bottom: 1px solid #1e293b; }
    li a { color: #38bdf8; font-weight: 600; min-width: 6rem; } li span { color: #94a3b8; overflow-wrap: anywhere; }
    footer { margin-top: 2rem; color: #64748b; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <h1>✂️ <span>snip</span></h1>
    <p class="sub">Korte links, automatisch gedeployd. Web (nginx) → api (Node) → db (Postgres), elk in een eigen container.</p>

    <form id="nieuw">
      <input name="url" type="url" placeholder="https://..." required>
      <input name="code" class="code" placeholder="code (optioneel)">
      <button>Inkorten</button>
    </form>
    <p id="melding"></p>

    <ul id="links"></ul>
    <footer id="info"></footer>
  </main>

  <script>
    const lijst = document.querySelector('#links')
    const melding = document.querySelector('#melding')

    async function laad() {
      const res = await fetch('/api/links')
      if (!res.ok) { melding.textContent = 'De api is niet bereikbaar.'; return }
      lijst.replaceChildren(...(await res.json()).map(({ code, url }) => {
        const li = document.createElement('li')
        li.innerHTML = `<a href="/${code}" target="_blank">/${code}</a><span></span>`
        li.querySelector('span').textContent = url
        return li
      }))
      const info = await (await fetch('/api/info')).json()
      document.querySelector('#info').textContent = `api ${info.versie} · container ${info.container}`
    }

    document.querySelector('#nieuw').addEventListener('submit', async (e) => {
      e.preventDefault()
      const data = Object.fromEntries(new FormData(e.target))
      if (!data.code) delete data.code
      const res = await fetch('/api/links', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(data) })
      melding.textContent = res.ok ? '' : (await res.json()).fout
      if (res.ok) { e.target.reset(); laad() }
    })

    laad()
  </script>
</body>
</html>
