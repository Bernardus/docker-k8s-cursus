# nginx is de voordeur van snip:
#   /          → de webpagina (statische bestanden)
#   /api/...   → doorgestuurd naar de api-container
#   /<code>    → bestaat er geen bestand met die naam, dan mag de api doorsturen
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:3000;
    }

    location / {
        try_files $uri $uri/ @api;
    }

    location @api {
        proxy_pass http://api:3000;
    }
}
