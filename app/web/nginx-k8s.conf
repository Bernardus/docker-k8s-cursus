# nginx in Kubernetes: serveert de webpagina.
# /api gaat via de Gateway rechtstreeks naar de API. Alleen korte links (/gh)
# komen hier binnen; bestaat er geen bestand met die naam, dan vraagt nginx het de API.
server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ @api;
    }

    location @api {
        proxy_pass http://snip-api;   # de Service snip-api (poort 80)
    }
}
