name: snip

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: snip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql
      - ./db/links.sql:/docker-entrypoint-initdb.d/links.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "snip"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./api
    image: snip-api:compose
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/snip
      APP_VERSION: compose
    depends_on:
      db:
        condition: service_healthy
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./web/site:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
  adminer:
    image: adminer
    profiles: ["tools"]
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
volumes:
  db-data: