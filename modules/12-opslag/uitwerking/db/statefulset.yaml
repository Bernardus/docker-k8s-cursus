apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: snip-db
  labels:
    app: snip-db
spec:
  serviceName: snip-db          # de Service hieronder geeft de pod een vaste naam
  replicas: 1
  selector:
    matchLabels:
      app: snip-db
  template:
    metadata:
      labels:
        app: snip-db
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: snip
            - name: POSTGRES_PASSWORD           # hetzelfde wachtwoord als de API gebruikt
              valueFrom:
                secretKeyRef:
                  name: snip-db
                  key: password
          volumeMounts:
            - name: data                        # de opslag (zie volumeClaimTemplates)
              mountPath: /var/lib/postgresql
            - name: init                        # links.sql, alleen bij de eerste start
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: snip-db-init
  volumeClaimTemplates:                         # vraag per pod een eigen schijf aan
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
