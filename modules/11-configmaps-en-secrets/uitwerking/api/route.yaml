# Alles onder /api gaat rechtstreeks naar de API.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: snip-api
spec:
  parentRefs:
    - name: snip
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: snip-api
          port: 80
